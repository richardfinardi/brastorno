<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação de Produção - GRUPO BRASTORNO</title>

    <!-- VERIFICAÇÃO DE AUTENTICAÇÃO -->
    <script>
        if (!localStorage.getItem('brastorno_token')) {
            window.location.href = './login.html';
        }
    </script>

    <!-- Tailwind CSS com a Paleta Oficial Brastorno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brastorno: {
                            green: '#6b8e23',       /* Verde Oliva / Sustentável */
                            greenHover: '#55721a',  /* Verde mais escuro para interações */
                            blue: '#1b2d56',        /* Azul Escuro da Marca */
                            darkBlue: '#101a35',    /* Azul Escuro Header */
                            bgLight: '#f4f5f7'      /* Fundo cinza suave */
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f4f5f7; color: #101a35; }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #e2e8f0; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #6b8e23; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-brastorno-bgLight text-brastorno-blue">

    <!-- HEADER -->
    <header class="bg-brastorno-darkBlue text-white sticky top-0 z-50 shadow-md border-b-4 border-brastorno-green">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            
            <!-- Logo & Marca GRUPO BRASTORNO -->
            <div class="flex items-center gap-3">
                <div class="p-2 bg-white rounded-xl shadow-sm text-brastorno-green flex items-center justify-center">
                    <i data-lucide="cog" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold tracking-wide text-white leading-tight">GRUPO BRASTORNO</h1>
                    <p class="text-xs text-brastorno-green font-semibold">Controle e Programação de Produção</p>
                </div>
            </div>

            <!-- Ações do Topo -->
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 px-3 py-1.5 bg-brastorno-blue border border-slate-700 rounded-xl text-xs font-bold text-slate-200">
                    <i data-lucide="user-check" class="w-3.5 h-3.5 text-brastorno-green"></i>
                    <span id="userDisplayName">Usuário</span>
                </div>

                <button id="btnRefresh" onclick="fetchData(false)" class="flex items-center gap-1 px-3 py-1.5 bg-brastorno-green hover:bg-brastorno-greenHover text-white rounded-xl font-bold text-xs transition shadow" title="Atualizar Dados">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refreshIcon"></i>
                    <span>Atualizar</span>
                </button>

                <button onclick="efetuarLogout()" class="flex items-center gap-1 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-xs transition shadow" title="Sair do Sistema">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTADOR -->
    <div class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-500 uppercase">Total de Ordens de Serviço:</span>
                <span id="metricTotalOS" class="text-lg font-extrabold text-brastorno-blue">0</span>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl w-full mx-auto p-4 flex flex-col gap-4 flex-1">
        
        <!-- BUSCA GERAL -->
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
                <input type="search" 
                       id="searchInput" 
                       oninput="renderView()" 
                       placeholder="Pesquisar por Nº OS, Título, Cliente, Compras, Terceiros, Produção ou Observação..." 
                       autocomplete="off"
                       class="w-full text-xs bg-transparent text-brastorno-blue focus:outline-none placeholder-slate-400 font-medium">
            </div>
        </div>

        <!-- LISTAGEM DE CARDS -->
        <div id="calendarGrid" class="w-full">
            <!-- Renderizado via JS -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between text-xs text-slate-500">
            <div class="flex items-center gap-2 font-medium">
                <i data-lucide="shield-check" class="w-4 h-4 text-brastorno-green"></i>
                <span>© 2026 GRUPO BRASTORNO — Sistema de Gestão de Produção</span>
            </div>
        </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        const API_URL = 'https://brastorno.consultoriarf.net/producao';

        let rawData = [];

        document.addEventListener('DOMContentLoaded', () => {
            const nomeUser = localStorage.getItem('brastorno_usuario_nome');
            if (nomeUser) {
                const displayEl = document.getElementById('userDisplayName');
                if (displayEl) displayEl.textContent = nomeUser;
            }

            lucide.createIcons();
            fetchData();

            setInterval(() => {
                fetchData(true);
            }, 30000);
        });

        function efetuarLogout() {
            localStorage.removeItem('brastorno_token');
            localStorage.removeItem('brastorno_usuario_nome');
            window.location.href = './login.html';
        }

        function formatDate(dtStr) {
            if (!dtStr || dtStr === 'NaT' || dtStr === 'None' || dtStr === 'null') return '-';
            const cleanStr = String(dtStr).trim();
            if (cleanStr.length < 10) return '-';
            const yyyyMmDd = cleanStr.substring(0, 10);
            const parts = yyyyMmDd.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return cleanStr;
        }

        async function fetchData(isSilent = false) {
            const refreshIcon = document.getElementById('refreshIcon');
            const btnRefresh = document.getElementById('btnRefresh');
            
            if (!isSilent && refreshIcon) refreshIcon.classList.add('animate-spin');
            if (!isSilent && btnRefresh) btnRefresh.disabled = true;

            try {
                const response = await fetch(`${API_URL}?_t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`Erro: ${response.status}`);

                rawData = await response.json();
                renderView();

            } catch (error) {
                console.error('Erro ao buscar dados:', error);
                if (!isSilent) {
                    alert('Não foi possível conectar ao servidor do GRUPO BRASTORNO.');
                }
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
                if (btnRefresh) btnRefresh.disabled = false;
                lucide.createIcons();
            }
        }

        function getFilteredData() {
            const search = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

            if (!search) return rawData;

            return rawData.filter(item => {
                const matchOS = String(item.n_os || '').toLowerCase().includes(search);
                const matchTitulo = String(item.titulo || '').toLowerCase().includes(search);
                const matchCliente = String(item.cliente || '').toLowerCase().includes(search);
                const matchCompras = String(item.status_compras || '').toLowerCase().includes(search);
                const matchTerceiros = String(item.status_terceiros || '').toLowerCase().includes(search);
                const matchProducao = String(item.status_producao || '').toLowerCase().includes(search);
                const matchObs = String(item.obs_texto_limpo || '').toLowerCase().includes(search);

                return matchOS || matchTitulo || matchCliente || matchCompras || matchTerceiros || matchProducao || matchObs;
            });
        }

        function renderView() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            const filtered = getFilteredData();
            
            const elTotal = document.getElementById('metricTotalOS');
            if (elTotal) elTotal.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400 flex flex-col items-center gap-2 shadow-sm">
                        <i data-lucide="file-x" class="w-10 h-10 text-slate-300 stroke-1"></i>
                        <p class="text-xs font-bold text-slate-600">Nenhuma Ordem de Serviço encontrada.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${filtered.map(item => renderOSCard(item)).join('')}
                </div>
            `;

            grid.innerHTML = html;
            lucide.createIcons();
        }

        function renderOSCard(item) {
            const nOs = String(item.n_os || '').trim();
            const titulo = item.titulo || 'SEM TÍTULO';
            const cliente = item.cliente || 'CLIENTE NÃO INFORMADO';
            const dtAbertura = formatDate(item.abertura_os);
            const dtEntregaNorm = formatDate(item.entrega_normalizada);
            const statusCompras = item.status_compras || '-';
            const statusTerceiros = item.status_terceiros || '-';
            const statusProducao = item.status_producao || '0%';
            const obsTexto = item.obs_texto_limpo || '';

            return `
                <div class="bg-white border border-slate-200 hover:border-brastorno-green hover:shadow-md p-4 rounded-2xl transition-all flex flex-col justify-between gap-3 relative">
                    
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="font-mono text-xs font-black text-brastorno-blue bg-slate-100 px-2.5 py-1 rounded-lg border border-slate-200">
                                OS ${nOs}
                            </span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 border border-amber-200 font-mono">
                                Produção: ${statusProducao}
                            </span>
                        </div>
                        <h3 class="text-xs font-black text-brastorno-blue uppercase leading-snug" title="${titulo}">
                            ${titulo}
                        </h3>
                        <p class="text-[11px] font-bold text-slate-500 uppercase truncate mt-0.5" title="${cliente}">
                            👤 ${cliente}
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-[10.5px]">
                        <div>
                            <span class="text-slate-400 block font-semibold text-[9px] uppercase">Abertura OS</span>
                            <strong class="text-slate-700 font-bold">${dtAbertura}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[9px] uppercase">Entrega Normalizada</span>
                            <strong class="text-brastorno-green font-extrabold">${dtEntregaNorm}</strong>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-[10.5px] space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400 font-bold text-[9.5px]">Status Compras:</span>
                            <span class="font-bold text-slate-700 truncate max-w-[150px]">${statusCompras}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-400 font-bold text-[9.5px]">Status Terceiros:</span>
                            <span class="font-bold text-slate-700 truncate max-w-[150px]">${statusTerceiros}</span>
                        </div>
                    </div>

                    <!-- Edição da Observação -->
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-extrabold text-[10px] text-slate-600 uppercase flex items-center gap-1">
                                <i data-lucide="message-square" class="w-3 h-3 text-brastorno-green"></i> Observação
                            </span>
                            <button id="btnEditObs_${nOs}" onclick="habilitarEdicaoObs('${nOs}')" class="text-[10px] font-bold text-brastorno-green hover:text-brastorno-greenHover underline flex items-center gap-1">
                                <i data-lucide="edit-3" class="w-3 h-3"></i> Alterar
                            </button>
                        </div>

                        <div id="viewObs_${nOs}" class="text-[11px] text-slate-700 font-medium whitespace-pre-wrap leading-relaxed min-h-[20px]">
                            ${obsTexto ? obsTexto : '<span class="text-slate-400 italic">Sem observação cadastrada.</span>'}
                        </div>

                        <div id="editObsContainer_${nOs}" class="hidden space-y-2 pt-1 border-t border-slate-200">
                            <textarea id="textareaObs_${nOs}" rows="3" class="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-800 focus:outline-none focus:border-brastorno-green font-medium custom-scroll" placeholder="Digite a observação..."></textarea>
                            
                            <div class="flex justify-end gap-1.5">
                                <button onclick="cancelarEdicaoObs('${nOs}')" class="px-2.5 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-bold text-[10px] transition">
                                    Cancelar
                                </button>
                                <button id="btnSaveObs_${nOs}" onclick="salvarObservacao('${nOs}')" class="px-3 py-1 bg-brastorno-green hover:bg-brastorno-greenHover text-white rounded-lg font-bold text-[10px] transition flex items-center gap-1 shadow-xs">
                                    <i data-lucide="save" class="w-3 h-3"></i> Gravar
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        function habilitarEdicaoObs(nOs) {
            const item = rawData.find(i => String(i.n_os).trim() === String(nOs).trim());
            const currentObs = item ? (item.obs_texto_limpo || '') : '';

            const viewEl = document.getElementById(`viewObs_${nOs}`);
            const containerEl = document.getElementById(`editObsContainer_${nOs}`);
            const btnEdit = document.getElementById(`btnEditObs_${nOs}`);
            const textarea = document.getElementById(`textareaObs_${nOs}`);

            if (viewEl) viewEl.classList.add('hidden');
            if (btnEdit) btnEdit.classList.add('hidden');
            if (containerEl) containerEl.classList.remove('hidden');
            if (textarea) {
                textarea.value = currentObs;
                textarea.focus();
            }
        }

        function cancelarEdicaoObs(nOs) {
            const viewEl = document.getElementById(`viewObs_${nOs}`);
            const containerEl = document.getElementById(`editObsContainer_${nOs}`);
            const btnEdit = document.getElementById(`btnEditObs_${nOs}`);

            if (viewEl) viewEl.classList.remove('hidden');
            if (btnEdit) btnEdit.classList.remove('hidden');
            if (containerEl) containerEl.classList.add('hidden');
        }

        async function salvarObservacao(nOs) {
            const textarea = document.getElementById(`textareaObs_${nOs}`);
            if (textarea) textarea.blur(); // Fecha o teclado do celular

            const novaObs = textarea ? String(textarea.value) : '';
            const btnSave = document.getElementById(`btnSaveObs_${nOs}`);

            try {
                if (btnSave) {
                    btnSave.disabled = true;
                    btnSave.classList.add('opacity-50');
                    btnSave.innerText = 'Gravando...';
                }

                const response = await fetch(`${API_URL}/${nOs}/observacao`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ obs_texto_limpo: novaObs })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Erro ao gravar a observação.');
                }

                // Atualiza a memória local
                const target = rawData.find(i => String(i.n_os).trim() === String(nOs).trim());
                if (target) {
                    target.obs_texto_limpo = novaObs;
                }

                cancelarEdicaoObs(nOs);
                renderView();

            } catch (error) {
                console.error('Erro ao gravar observação:', error);
                alert(`Erro: ${error.message}`);
            } finally {
                if (btnSave) {
                    btnSave.disabled = false;
                    btnSave.classList.remove('opacity-50');
                    btnSave.innerHTML = '<i data-lucide="save" class="w-3 h-3"></i> Gravar';
                    if (window.lucide) lucide.createIcons();
                }
            }
        }
    </script>
</body>
</html>
