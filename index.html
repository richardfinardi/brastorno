<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brastorno | Aplicacoes</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="./controle_fabrica/favicon.png"><style>
*{box-sizing:border-box}body{font:14px/1.5 Arial,system-ui,sans-serif;margin:0;background:#f3f6fa;color:#20314c}header{background:#142446;color:white;border-bottom:5px solid #708e34;padding:17px 25px}.barra{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.barra img{width:165px;height:55px;object-fit:contain;background:white;border-radius:8px;padding:4px}.barra button{background:#263b5c;border:1px solid #687c99;color:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.container{max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:29px;margin:0 0 5px}.sub{color:#65748c;margin:0 0 30px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.cartao{display:block;text-decoration:none;color:inherit;background:white;border:1px solid #dde5ef;border-radius:17px;padding:27px;box-shadow:0 5px 18px #1424460a;transition:.15s}.cartao:hover{transform:translateY(-3px);border-color:#708e34}.cartao .icone{background:#e8f1dc;color:#66852b;border-radius:12px;font-size:28px;font-weight:900;padding:10px;display:inline-block;margin-bottom:14px}.cartao h2{margin:0 0 6px;color:#142446}.cartao p{color:#697990;margin:0}.erro{background:#fff0f1;color:#9e2f42;padding:17px;border-radius:12px}.carregando{color:#6d7c91}.usuario{color:#708e34;font-weight:bold}@media(max-width:600px){.container{margin:22px auto}header{padding:12px}.barra img{width:115px;height:42px}h1{font-size:22px}}
</style></head><body><header><div class="barra"><img src="./controle_fabrica/brastorno_logo.png" alt="Brastorno"><div><span id="usu"></span> <button id="sair">Sair</button></div></div></header><main class="container"><h1>Aplicacoes Brastorno</h1><p class="sub">Selecione a aplicacao autorizada para o seu usuario.</p><div id="cards" class="carregando">Validando permissoes...</div></main><script>
(function(){"use strict";var t=localStorage.getItem("brastorno_token");if(!t){location.href="./login.html";return;}
document.getElementById("sair").onclick=function(){localStorage.removeItem("brastorno_token");localStorage.removeItem("brastorno_usuario_nome");location.href="./login.html"};
function e(v){return String(v||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
fetch("https://brastorno.consultoriarf.net/brastorno/menu/perfil",{headers:{Authorization:"Bearer "+t},cache:"no-store"})
.then(function(r){if(r.status===401){location.href="./login.html";throw Error("Sessao expirada.")}return r.json().then(function(v){if(!r.ok)throw Error(v.detail||"HTTP "+r.status);return v})})
.then(function(p){
 document.getElementById("usu").textContent=p.usuario||"";
 var c=[];
 if(p.controle_fabrica)c.push('<a class="cartao" href="./controle_fabrica/"><span class="icone">F</span><h2>Controle de Fabrica</h2><p>Gestao de ordens de servico, status e Kanban.</p></a>');
 if(p.inventario)c.push('<a class="cartao" href="./inventario/"><span class="icone">I</span><h2>Inventario</h2><p>Contagem fisica, reservas, conferencias e ajustes de estoque.</p></a>');
 document.getElementById("cards").className="cards";
 document.getElementById("cards").innerHTML=c.join("")||'<p>Nenhum modulo autorizado.</p>';
}).catch(function(err){document.getElementById("cards").innerHTML='<div class="erro">'+e(err.message)+'</div>'});
})();
</script></body></html>
