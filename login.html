<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GRUPO BRASTORNO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brastorno: {
                            green: '#6b8e23',
                            greenHover: '#55721a',
                            blue: '#1b2d56',
                            darkBlue: '#101a35'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden">
        <div class="bg-brastorno-darkBlue p-6 text-center text-white border-b-4 border-brastorno-green">
            <h1 class="text-xl font-extrabold tracking-wide">GRUPO BRASTORNO v1</h1>
            <p class="text-xs text-brastorno-green font-semibold mt-1">Acesso ao Controle de Produção</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Usuário:</label>
                <input type="text" id="inputUsuario" required placeholder="Digite seu usuário..." 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 text-xs focus:outline-none focus:border-brastorno-green font-bold uppercase">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Senha:</label>
                <input type="password" id="inputSenha" required placeholder="Digite sua senha..." 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 text-xs focus:outline-none focus:border-brastorno-green font-medium">
            </div>

            <p id="msgError" class="text-red-600 font-bold text-center hidden bg-red-50 p-2.5 rounded-xl border border-red-200"></p>

            <button type="submit" id="btnLogin" class="w-full py-3 bg-brastorno-green text-white font-extrabold rounded-xl hover:bg-brastorno-greenHover transition shadow-md text-xs">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('inputUsuario').value.trim().toUpperCase();
            const senha = document.getElementById('inputSenha').value;
            
            const msgError = document.getElementById('msgError');
            const btnLogin = document.getElementById('btnLogin');

            msgError.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Autenticando...';

            try {
                const response = await fetch('https://brastorno.consultoriarf.net/producao/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Usuário ou senha inválidos.');
                }

                // Salva apenas as credenciais essenciais do usuário logado
                localStorage.setItem('brastorno_token', data.access_token);
                localStorage.setItem('brastorno_usuario_nome', data.usuario);

                // Limpa quaisquer chaves antigas de permissão
                localStorage.removeItem('columbia_perm_faturamento');
                localStorage.removeItem('columbia_perm_finalizacao');
                localStorage.removeItem('columbia_perm_anexo');

                window.location.href = './index.html';

            } catch (error) {
                msgError.textContent = error.message;
                msgError.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar no Sistema';
            }
        }
    </script>
</body>
</html>
