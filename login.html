<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Login | Brastorno</title><link rel="icon" href="./controle_fabrica/favicon.png">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{brastorno:{green:"#708e34",greenHover:"#617b2e",blue:"#203657",darkBlue:"#142446"}}}}}</script>
<style>
:root{--navy:#142446;--olive:#708e34;--bg:#f4f6fa;--ink:#1d2a40;--muted:#738198}
.site-header{background:#142446;color:#fff;border-bottom:5px solid #708e34;box-shadow:0 3px 15px #0c18342b}
.site-head{max-width:1500px;min-height:115px;padding:17px 24px;margin:auto;display:flex;gap:17px;align-items:center;justify-content:space-between}
.site-brand{display:flex;gap:17px;align-items:center;min-width:0}
.site-brand .client-brand-logo{width:184px;max-height:66px;height:auto;object-fit:contain;background:transparent!important;padding:0!important;border:0!important;border-radius:0!important;flex-shrink:0}
.site-brand .partner-brand-logo{width:188px;max-height:42px;height:auto;object-fit:contain;background:transparent!important;padding:0!important;border:0!important;border-radius:0!important;flex-shrink:0}
.site-brand .brand-divider{width:1px;height:38px;background:#60708a;flex-shrink:0}
.site-brand .brand-copy{min-width:0}
.site-brand .brand-copy strong{font-size:14px;line-height:1.35;font-weight:850;letter-spacing:.04em;display:block;color:#fff;text-transform:uppercase;white-space:nowrap}
.site-brand .brand-copy small{font-size:11px;color:#b9c7dc;display:block;line-height:1.35;margin-top:3px}
.site-actions{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.site-actions .site-action{background:#243758;color:#e6edf6;border:1px solid #50617c;border-radius:10px;font-weight:700;font-size:12px;padding:8px 11px;text-decoration:none;cursor:pointer}
.site-actions .site-action:hover{background:#365072;color:#fff}
.page-eyebrow{color:#708e34;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.page-hero h1{font-size:26px;letter-spacing:-.04em;color:#142446;line-height:1.25;margin:4px 0}
.page-subtitle{font-size:12px;color:#738198;margin:3px 0}
@media(max-width:1100px){.site-brand{gap:12px}.site-brand .client-brand-logo{width:155px}.site-brand .partner-brand-logo{width:150px}.site-brand .brand-copy strong{font-size:12px}}
@media(max-width:760px){.site-head{padding:12px;min-height:0;flex-wrap:wrap;gap:9px}.site-actions{width:100%}.site-brand .client-brand-logo{width:132px}.site-brand .partner-brand-logo{width:123px}.site-brand .brand-divider{height:29px}.site-brand .brand-copy strong{font-size:11px}.site-brand .brand-copy small{font-size:9px}}
@media(max-width:510px){.site-brand{gap:7px}.site-brand .client-brand-logo{width:119px}.site-brand .partner-brand-logo{width:108px}.site-brand .brand-copy strong{font-size:10px}.site-brand .brand-copy small{font-size:9px}.page-hero h1{font-size:22px}}

body{background:#f4f6fa;color:#1d2a40;font:14px/1.48 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.login-content{max-width:1500px;margin:auto;padding:24px 24px 50px}
.login-card{max-width:460px;margin:24px auto 0;background:#fff;border:1px solid #e0e6ee;border-radius:16px;overflow:hidden;box-shadow:0 6px 22px #10234413}
.login-card-head{background:#f7f9fc;text-align:center;padding:19px 24px 15px;border-bottom:1px solid #e9edf3}
.login-card-head h2{margin:0;color:#142446;font-size:17px;font-weight:850}
.login-card-head p{margin:4px 0 0;color:#738198;font-size:11px}
.login-card form{padding:24px!important;font-size:13px!important}
.login-card #btnLogin{background:#708e34}.login-card #btnLogin:hover{background:#617b2e}
@media(max-width:600px){.login-content{padding:16px 12px 30px}.login-card{margin-top:16px}}
</style></head><body>
<header class="site-header"><div class="site-head"><div class="site-brand"><img class="client-brand-logo" src="./controle_fabrica/brastorno_logo.png" alt="Brastorno"><span class="brand-divider" aria-hidden="true"></span><div class="brand-copy"><strong>ACESSO AOS SISTEMAS</strong><small>Controle de Fabrica e Inventario</small></div><span class="brand-divider" aria-hidden="true"></span><img class="partner-brand-logo" src="./LOGO.PNG" alt="Consultoria.RF"></div></div></header>
<main class="login-content"><div class="page-hero"><div class="page-eyebrow">GESTAO INDUSTRIAL</div><h1>Entrar na Brastorno</h1><p class="page-subtitle">Utilize seu usuario e senha do CPS.</p></div>
<div class="login-card"><div class="login-card-head"><h2>Identificacao do usuario</h2><p>O menu mostra somente suas aplicacoes autorizadas.</p></div><form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Usuário:</label>
                <input type="text" id="inputUsuario" required placeholder="Digite seu usuário..." 
                       class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-slate-800 text-xs focus:outline-none focus:border-brastorno-green font-bold uppercase">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">Senha:</label>
                <div class="relative">
                    <input type="password" id="inputSenha" required placeholder="Digite sua senha..." autocomplete="current-password"
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 pr-12 text-slate-800 text-xs focus:outline-none focus:border-brastorno-green font-medium">
                    <button type="button" id="btnMostrarSenha" onclick="toggleSenha()" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha"
                            class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-brastorno-blue focus:outline-none focus-visible:ring-2 focus-visible:ring-brastorno-green rounded-lg">
                        <svg id="iconeOlho" xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.5-6.75 9.75-6.75S21.75 12 21.75 12s-3.5 6.75-9.75 6.75S2.25 12 2.25 12Z"/>
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg id="iconeOlhoFechado" class="hidden" xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m3 3 18 18M10.59 5.37A10.2 10.2 0 0 1 12 5.25c6.25 0 9.75 6.75 9.75 6.75a14.3 14.3 0 0 1-3.18 3.65M6.01 6.6C3.55 8.33 2.25 12 2.25 12s3.5 6.75 9.75 6.75c1.21 0 2.34-.25 3.39-.68" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.56 10.56a2 2 0 0 0 2.88 2.88"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p id="msgError" class="text-red-600 font-bold text-center hidden bg-red-50 p-2.5 rounded-xl border border-red-200"></p>

            <button type="submit" id="btnLogin" class="w-full py-3 bg-brastorno-green text-white font-extrabold rounded-xl hover:bg-brastorno-greenHover transition shadow-md text-xs">
                Entrar no Sistema
            </button>
        </form></div></main>
<script>function toggleSenha() {
            const campo = document.getElementById('inputSenha');
            const botao = document.getElementById('btnMostrarSenha');
            const visivel = campo.type === 'password';
            campo.type = visivel ? 'text' : 'password';
            botao.setAttribute('aria-label', visivel ? 'Ocultar senha' : 'Mostrar senha');
            botao.setAttribute('title', visivel ? 'Ocultar senha' : 'Mostrar senha');
            botao.setAttribute('aria-pressed', String(visivel));
            document.getElementById('iconeOlho').classList.toggle('hidden', visivel);
            document.getElementById('iconeOlhoFechado').classList.toggle('hidden', !visivel);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('inputUsuario').value.trim().toUpperCase();
            const senha = document.getElementById('inputSenha').value;
            
            const msgError = document.getElementById('msgError');
            const btnLogin = document.getElementById('btnLogin');

            msgError.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Autenticando...';

            try {
                const response = await fetch('https://brastorno.consultoriarf.net/producao/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Usuário ou senha inválidos.');
                }

                // Salva apenas as credenciais essenciais do usuário logado
                localStorage.setItem('brastorno_token', data.access_token);
                localStorage.setItem('brastorno_usuario_nome', data.usuario);

                // Limpa quaisquer chaves antigas de permissão
                localStorage.removeItem('columbia_perm_faturamento');
                localStorage.removeItem('columbia_perm_finalizacao');
                localStorage.removeItem('columbia_perm_anexo');

                window.location.href = './index.html';

            } catch (error) {
                msgError.textContent = error.message;
                msgError.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar no Sistema';
            }
        }
        // Apresentacao em texto puro: sem acento ou cedilha, sem tocar nos valores.
        function textoPuroVisual(valor) {
            return String(valor).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        }
        function converterTextoVisivel(raiz) {
            if (!raiz) return;
            if (raiz.nodeType === Node.TEXT_NODE) {
                const pai=raiz.parentElement;
                if (!pai || pai.closest('script,style,textarea,code,pre')) return;
                const v=textoPuroVisual(raiz.nodeValue);
                if (v!==raiz.nodeValue) raiz.nodeValue=v;
                return;
            }
            if (raiz.nodeType !== Node.ELEMENT_NODE) return;
            const walker=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT);
            let no;
            while((no=walker.nextNode()))converterTextoVisivel(no);
            [raiz,...raiz.querySelectorAll('[title],[placeholder],[aria-label]')].forEach(el=>{
                ['title','placeholder','aria-label'].forEach(chave=>{
                    if(el.hasAttribute(chave))el.setAttribute(chave,textoPuroVisual(el.getAttribute(chave)));
                });
            });
        }
        new MutationObserver(mudancas=>mudancas.forEach(m=>{
            if(m.type==='characterData')converterTextoVisivel(m.target);
            else m.addedNodes.forEach(converterTextoVisivel);
        })).observe(document.body,{subtree:true,childList:true,characterData:true});
        converterTextoVisivel(document.body);
    </script></body></html>
