<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario | Brastorno</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../controle_fabrica/favicon.png"><link rel="stylesheet" href="./style.css"></head><body>
<header><div class="top"><div class="brand"><img src="../controle_fabrica/brastorno_logo.png" alt="Brastorno"><span>INVENTARIO</span></div><div class="top-direita"><span id="usuario"></span><a href="../">Menu</a><button onclick="BRLogout()">Sair</button></div></div></header>
<main id="corpo"><div class="cabecalho"><div><h1 id="tituloAba">Contagem</h1><p>Grupo Brastorno | Deposito 1 | Contagem controlada</p></div><div class="campo"><label>EMPRESA</label><select id="empresa" onchange="BREmpresa(this.value)"><option value="1">Empresa 1</option><option value="2">Empresa 2</option><option value="3">Empresa 3</option><option value="4">Empresa 4</option><option value="5">Empresa 5</option><option value="6">Empresa 6</option></select></div></div>
<div class="abas"><button data-aba="reservados" data-gestor onclick="BRAba('reservados')">Itens reservados</button><button data-aba="contagem" onclick="BRAba('contagem')">Contagem</button><button data-aba="parametrizacoes" data-gestor onclick="BRAba('parametrizacoes')">Parametrizacoes</button><button data-aba="conferencia" data-gestor onclick="BRAba('conferencia')">Conferencia</button></div>
<div id="aviso" class="aviso" role="status"></div>
<div id="filtros" class="filtros"><div class="campo busca"><label>PESQUISAR MATERIAL, CODIGO OU LOCAL</label><input id="pesquisa" placeholder="Pesquisar..." autocomplete="off"></div><button id="limparBusca">Limpar</button><button onclick="BRExportar()" data-gestor>Exportar CSV (pagina)</button></div>
<section id="reservados" hidden><div class="subtop"><p id="resumo"></p></div></section>
<section id="contagem"><div class="subtop"><p id="resumoContagem"></p></div></section>
<div id="lista"></div><div id="paginacao"></div>
<div id="acaoContagem" hidden><b id="quantidadeDigitada">0 material(is) para enviar</b><button id="btnEnviar" class="destaque" onclick="BREnviar()">Enviar para conferencia</button></div>
<section id="parametrizacoes" class="painel" hidden><h2>Parametrizacoes da empresa</h2><div id="formConfig"></div></section>
<section id="conferencia" class="painel" hidden><div class="subtop"><h2>Contagens recebidas</h2><select id="statusConferencia" onchange="BRCarregarConferencia()"><option value="PENDENTE">Pendentes</option><option value="APLICADA">Aplicadas</option><option value="REJEITADA">Rejeitadas</option><option value="TODOS">Todas</option></select></div><div id="listaConferencia"></div></section>
</main><div id="modal" hidden></div><script src="./app.js"></script></body></html>
