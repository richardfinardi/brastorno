<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario | Brastorno</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../controle_fabrica/favicon.png"><link rel="stylesheet" href="./style.css"></head><body>
<header class="site-header"><div class="site-head"><div class="site-brand"><img class="client-brand-logo" src="../controle_fabrica/brastorno_logo.png" alt="Brastorno"><span class="brand-divider" aria-hidden="true"></span><div class="brand-copy"><strong>INVENTARIO</strong><small>Gestao de materiais e contagem</small></div><span class="brand-divider" aria-hidden="true"></span><img class="partner-brand-logo" src="../LOGO.PNG" alt="Consultoria.RF"></div><div class="site-actions"><span id="usuario" style="font-size:12px;font-weight:800"></span><a class="site-action" href="../">Menu</a><button class="site-action" onclick="BRLogout()">Sair</button></div></div></header>
<main id="corpo"><div class="cabecalho page-hero"><div><div class="page-eyebrow">GESTAO INDUSTRIAL</div><h1 id="tituloAba">Contagem</h1><p class="page-subtitle">Deposito 1 | Materia-prima e produtos acabados</p></div><div class="campo"><label>EMPRESA</label><select id="empresa" onchange="BREmpresa(this.value)"><option value="1">Empresa 1</option><option value="2">Empresa 2</option><option value="3">Empresa 3</option><option value="4">Empresa 4</option><option value="5">Empresa 5</option><option value="6">Empresa 6</option></select></div></div>
<div class="abas"><button data-aba="reservados" data-gestor onclick="BRAba('reservados')">Itens reservados</button><button data-aba="contagem" onclick="BRAba('contagem')">Contagem</button><button data-aba="parametrizacoes" data-gestor onclick="BRAba('parametrizacoes')">Parametrizacoes</button><button data-aba="conferencia" data-gestor onclick="BRAba('conferencia')">Conferencia</button></div>
<div id="aviso" class="aviso" role="status"></div>
<div id="filtros" class="filtros"><div class="campo busca"><label>PESQUISAR MATERIAL, CODIGO OU LOCAL</label><input id="pesquisa" placeholder="Pesquisar..." autocomplete="off"></div><button type="button" id="btnFiltro" aria-controls="painelFiltros" onclick="BRToggleFiltros()">Filtros</button><button type="button" id="limparBusca">Limpar busca</button><button type="button" onclick="BRExportar()" data-gestor id="exportarInventario">Exportar CSV (pagina)</button><div id="painelFiltros" hidden><div class="campos-filtros"><div class="campo filtro-item"><label for="filtro_familia">Familia</label><select id="filtro_familia" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_grupo">Grupo</label><select id="filtro_grupo" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo1">Subgrupo 1</label><select id="filtro_subgrupo1" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo2">Subgrupo 2</label><select id="filtro_subgrupo2" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo3">Subgrupo 3</label><select id="filtro_subgrupo3" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo4">Subgrupo 4</label><select id="filtro_subgrupo4" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo5">Subgrupo 5</label><select id="filtro_subgrupo5" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo6">Subgrupo 6</label><select id="filtro_subgrupo6" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_subgrupo7">Subgrupo 7</label><select id="filtro_subgrupo7" onchange="BRFiltrar()"><option value="">Todos</option></select></div><div class="campo filtro-item"><label for="filtro_local_estoque">Local de estoque</label><select id="filtro_local_estoque" onchange="BRFiltrar()"><option value="">Todos</option></select></div></div><div class="acoes-filtros"><span id="msgFiltros">Carregando filtros...</span><button type="button" onclick="BRLimparFiltros()">Limpar filtros</button></div></div></div>
<section id="reservados" hidden><div class="subtop"><p id="resumo"></p></div></section>
<section id="contagem"><div class="subtop"><p id="resumoContagem"></p></div></section>
<div id="lista"></div><div id="paginacao"></div>
<div id="acaoContagem" hidden><b id="quantidadeDigitada">0 material(is) para enviar</b><button id="btnEnviar" class="destaque" onclick="BREnviar()">Enviar para conferencia</button></div>
<section id="parametrizacoes" class="painel" hidden><h2>Parametrizacoes da empresa</h2><div id="formConfig"></div></section>
<section id="conferencia" class="painel" hidden><div class="subtop"><h2>Contagens recebidas</h2><select id="statusConferencia" onchange="BRCarregarConferencia()"><option value="PENDENTE">Pendentes</option><option value="APLICADA">Aplicadas</option><option value="REJEITADA">Rejeitadas</option><option value="TODOS">Todas</option></select></div><div id="listaConferencia"></div></section>
</main><div id="modal" hidden></div><script src="./app.js"></script></body></html>
